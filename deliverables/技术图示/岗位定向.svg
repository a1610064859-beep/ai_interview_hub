  <rect x="1204" y="150" width="305" height="248" rx="12" fill="#102338" stroke="#7CFFCB" stroke-width="3"/>
  <path d="M1250 210h207M1250 260h163M1250 310h185M1250 360h120" stroke="#8199AF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1472" cy="337" r="47" fill="#123B46" stroke="#7CFFCB" stroke-width="3"/>
  <path d="M1446 337l16 16 34-39" fill="none" stroke="#7CFFCB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
