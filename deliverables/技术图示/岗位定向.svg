  <text x="55" y="281" class="b">智驾测试</text><text x="55" y="319" class="s">HIL / CAN / 偶发缺陷</text>
  <path d="M55 345H401" stroke="#385269" stroke-width="2"/>
  <text x="55" y="397" class="b">三电系统测试</text><text x="55" y="435" class="s">BMS / SOC / 高压安全</text>
  <text x="55" y="515" class="s">JD 要点与术语表进入提示词</text>
  <path d="M450 294H499" class="line" marker-end="url(#arr)"/>
  <rect x="515" y="25" width="545" height="535" rx="22" class="card"/>
  <text x="556" y="88" class="h mint">服务端固定六题结构</text>
  <rect x="555" y="143" width="132" height="132" rx="18" fill="#123B46" stroke="#7CFFCB" stroke-width="3"/>
  <rect x="722" y="143" width="132" height="132" rx="18" fill="#123B46" stroke="#7CFFCB" stroke-width="3"/>
  <rect x="889" y="143" width="132" height="132" rx="18" fill="#123B46" stroke="#7CFFCB" stroke-width="3"/>
  <text x="595" y="204" class="h">2</text><text x="578" y="248" class="b">通用</text>
  <text x="762" y="204" class="h">3</text><text x="745" y="248" class="b">专业</text>
  <text x="929" y="204" class="h">1</text><text x="912" y="248" class="b">情景</text>
  <path d="M568 330H1007" stroke="#58718A" stroke-width="2"/>
  <text x="555" y="388" class="b">最新维护的题目按类型选入</text>
