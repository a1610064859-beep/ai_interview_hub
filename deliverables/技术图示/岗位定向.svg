<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#F4F7FF}
      .h{font-size:34px;font-weight:700}.b{font-size:25px}.s{font-size:21px;fill:#BFCEE0}.mint{fill:#7CFFCB}.orange{fill:#FFAD66}
      .card{fill:#081427;fill-opacity:.9;stroke:#58718A;stroke-width:2}.line{fill:none;stroke:#7CFFCB;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#7CFFCB" stroke-width="2.5"/></marker>
  </defs>
  <rect x="16" y="25" width="425" height="535" rx="22" class="card"/>
